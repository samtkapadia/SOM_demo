<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kohonen SOM demo</title>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      max-width: 42rem;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.45;
      color: #1a1a1a;
    }
    h1 { font-size: 1.4rem; font-weight: 600; }
    label { display: block; margin-top: 0.7rem; font-size: 0.9rem; }
    input[type="text"], input[type="password"], input[type="number"] {
      width: 100%; box-sizing: border-box; padding: 0.4rem 0.5rem; margin-top: 0.15rem;
    }
    button { margin-top: 1rem; padding: 0.45rem 0.9rem; cursor: pointer; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .muted { color: #555; font-size: 0.9rem; }
    .error { color: #a40000; }
    /* fixed display size so a 10x10 and a 100x100 map look the same on screen */
    #map {
      width: 100%;
      max-width: 420px;
      height: auto;
      margin-top: 1rem;
      border: 1px solid #ddd;
      image-rendering: pixelated;
    }
    #app, #login { display: none; }
    fieldset { border: 1px solid #ddd; margin: 0; padding: 0.75rem 1rem 1rem; }
  </style>
  <script src="config.js"></script>
</head>
<body>
  <h1>Kohonen self-organising map</h1>
  <p class="muted">Random RGB points, trained in Lambda. Image stored in S3.</p>

  <section id="login">
    <h2>Sign in</h2>
    <label>Email <input id="email" type="text" autocomplete="username"></label>
    <label>Password <input id="password" type="password" autocomplete="current-password"></label>
    <button type="button" id="loginBtn">Log in</button>
    <p class="error" id="loginError"></p>
  </section>

  <section id="app">
    <p class="muted" id="who"></p>
    <fieldset>
      <legend>Hyperparameters</legend>
      <div class="row">
        <label>Width <input id="width" type="number" value="10" min="3" max="80"></label>
        <label>Height <input id="height" type="number" value="10" min="3" max="80"></label>
        <label>Iterations <input id="n_iter" type="number" value="100" min="1" max="400"></label>
        <label>Samples <input id="n_samples" type="number" value="10" min="2" max="50"></label>
        <label>Learning rate <input id="lr0" type="number" value="0.1" min="0.0001" max="1" step="0.01"></label>
        <label>Seed <input id="seed" type="number" value="7"></label>
      </div>
      <label><input id="radius_mask" type="checkbox"> Radius mask</label>
      <button type="button" id="trainBtn">Train</button>
    </fieldset>
    <p class="error" id="trainError"></p>
    <p id="status" class="muted"></p>
    <p id="qe"></p>
    <img id="map" alt="SOM RGB map" hidden>
    <p><button type="button" id="logoutBtn">Log out</button></p>
  </section>

  <p class="error" id="bootError"></p>

  <script>
    const cfg = window.SOM_CONFIG;
    const TOKEN_KEY = "som_id_token";

    function show(el, on) { el.style.display = on ? "block" : "none"; }

    async function cognitoLogin(username, password) {
      const res = await fetch(`https://cognito-idp.${cfg.region}.amazonaws.com/`, {
        method: "POST",
        headers: {
          "Content-Type": "application/x-amz-json-1.1",
          "X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth",
        },
        body: JSON.stringify({
          AuthFlow: "USER_PASSWORD_AUTH",
          ClientId: cfg.clientId,
          AuthParameters: { USERNAME: username, PASSWORD: password },
        }),
      });
      const data = await res.json();
      if (data.__type || data.message) {
        throw new Error(data.message || data.__type || "login failed");
      }
      return data.AuthenticationResult.IdToken;
    }

    function route() {
      const token = sessionStorage.getItem(TOKEN_KEY);
      show(document.getElementById("login"), !token);
      show(document.getElementById("app"), !!token);
    }

    document.getElementById("loginBtn").onclick = async () => {
      const err = document.getElementById("loginError");
      err.textContent = "";
      try {
        const token = await cognitoLogin(
          document.getElementById("email").value.trim(),
          document.getElementById("password").value,
        );
        sessionStorage.setItem(TOKEN_KEY, token);
        route();
      } catch (e) {
        err.textContent = e.message;
      }
    };

    document.getElementById("logoutBtn").onclick = () => {
      sessionStorage.removeItem(TOKEN_KEY);
      document.getElementById("password").value = "";
      document.getElementById("email").value = "";
      document.getElementById("loginError").textContent = "";
      document.getElementById("status").textContent = "";
      document.getElementById("qe").textContent = "";
      document.getElementById("map").hidden = true;
      route();
    };

    document.getElementById("trainBtn").onclick = async () => {
      const err = document.getElementById("trainError");
      const status = document.getElementById("status");
      const qe = document.getElementById("qe");
      const img = document.getElementById("map");
      err.textContent = "";
      qe.textContent = "";
      img.hidden = true;
      status.textContent = "Training…";
      const body = {
        width: Number(document.getElementById("width").value),
        height: Number(document.getElementById("height").value),
        n_iter: Number(document.getElementById("n_iter").value),
        n_samples: Number(document.getElementById("n_samples").value),
        lr0: Number(document.getElementById("lr0").value),
        seed: Number(document.getElementById("seed").value),
        radius_mask: document.getElementById("radius_mask").checked,
      };
      try {
        const res = await fetch(`${cfg.apiUrl}/train`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${sessionStorage.getItem(TOKEN_KEY)}`,
          },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || JSON.stringify(data));
        status.textContent = `run ${data.run_id}`;
        qe.textContent = `Quantization error: ${Number(data.quantization_error).toFixed(4)}`;
        img.src = data.image_url;
        img.hidden = false;
      } catch (e) {
        status.textContent = "";
        err.textContent = e.message;
      }
    };

    if (!cfg || cfg.region === "REPLACE_REGION") {
      document.getElementById("bootError").textContent =
        "Missing web/config.js. After sam deploy, run scripts/write_web_config.py and sync the website bucket.";
    } else {
      route();
    }
  </script>
</body>
</html>
